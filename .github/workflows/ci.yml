name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  userspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential

      - name: Build
        run: make

      - name: Test suite (basic + regression + corrupt-image)
        run: make check

      - name: Stress test
        run: ./tests/test_stress.sh

  kernel-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel headers
        run: |
          sudo apt-get update -qq
          KVER=$(uname -r)
          sudo apt-get install -y "linux-headers-$KVER" || \
            sudo apt-get install -y linux-headers-generic

      - name: Compile kernel module (W=1)
        run: |
          make kmod
          make -C /lib/modules/$(uname -r)/build M=$PWD/build/kmod W=1 modules 2>&1 \
            | tee /tmp/kmod.log
          # fail on warnings/errors originating in our source
          if grep -E 'aleqfs_ko\.c.*(warning|error)' /tmp/kmod.log; then
            echo "kernel module produced warnings"; exit 1
          fi
